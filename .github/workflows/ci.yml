name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, rules, API and browsers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools@15.28.2
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-15.28.2-${{ hashFiles('firebase.json') }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all:emu
      - name: Production build with placeholder public config
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: cotacero-test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: cotacero-test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: cotacero-test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:test'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
  all-checks:
    name: All Checks
    needs: [verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test '${{ needs.verify.result }}' = 'success'
